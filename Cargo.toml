[package]
name = "cheerlights"
version = "0.1.0"
edition = "2024"

[features]
http = ["dep:reqwest", "dep:serde_json"]
mqtt = ["dep:rumqttc"]

[dependencies]
reqwest = { version = "0.13.5", features = ["json"], optional = true }
rumqttc = { version = "0.25.1", default-features = false, optional = true }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = { version = "1.0.154", default-features = false, optional = true }
thiserror = { version = "2.0.21", default-features = false }
